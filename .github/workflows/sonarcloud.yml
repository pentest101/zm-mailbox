name: Zimbra Build & SonarCloud Scan

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ant ant-optional ant-contrib ruby git maven build-essential debhelper

      - name: Install SonarScanner
        run: |
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner-cli-*.zip
          echo "SONAR_SCANNER_HOME=$(pwd)/sonar-scanner-5.0.1.3006-linux" >> $GITHUB_ENV
          echo "$SONAR_SCANNER_HOME/bin" >> $GITHUB_PATH

      - name: Build zm-mailbox components
        run: |
          export ANT_OPTS="-Dzimbra.buildinfo.version=8.7.6_GA"
          cd zm-mailbox/native && ant clean compile publish-local deploy
          cd ../common && ant clean compile publish-local deploy
          cd ../soap && ant clean compile publish-local deploy
          cd ../client && ant clean compile publish-local deploy
          cd ../store && ant clean compile publish-local deploy

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=pentest101_zm-mailbox \
            -Dsonar.organization=pentest101 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.sources=client,common,milter-conf,native,soap,store-conf \
            -Dsonar.java.binaries=store/build
