name: SonarCloud Scan (No Build)

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Analysis (No Build)
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Lấy code về
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Cài đặt SonarScanner
      - name: Install SonarScanner CLI
        uses: SonarSource/sonarcloud-github-action@v2.0.2
        with:
          args: >
            -Dsonar.projectKey=ten_project
            -Dsonar.organization=ten_org
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.sources=zm-mailbox
            -Dsonar.java.binaries=.

      # ⚠️ Không build, nên chỉ quét source-level
